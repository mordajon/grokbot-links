<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Open in Grok Bot</title>
  <style>
    :root { color-scheme: light dark; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      display: flex; align-items: center; justify-content: center;
      min-height: 100vh; margin: 0; text-align: center;
    }
    main { max-width: 28rem; padding: 2rem; }
    a.button {
      display: inline-block; margin-top: 1rem; padding: 0.75rem 1.5rem;
      border-radius: 0.5rem; background: #2563eb; color: #fff; text-decoration: none;
    }
    .error { color: #dc2626; }
  </style>
</head>
<body>
  <main>
    <p id="message">Opening Grok Bot...</p>
    <a id="open" class="button" hidden>Open in Grok Bot</a>
  </main>
  <script>
    (function () {
      var ALLOWED_SCHEME = "grokbot://";
      var message = document.getElementById("message");
      var button = document.getElementById("open");
      var target = new URLSearchParams(window.location.search).get("to") || "";

      // Only grokbot:// links are allowed, so this page can't redirect anywhere else.
      var isAllowed =
        target.toLowerCase().indexOf(ALLOWED_SCHEME) === 0 &&
        !/[\s\u0000-\u001f\u007f]/.test(target);

      if (!isAllowed) {
        message.className = "error";
        message.textContent = target
          ? "This link isn't a Grok Bot link, so it won't be opened."
          : "No Grok Bot link was provided.";
        return;
      }

      button.setAttribute("href", target);
      button.hidden = false;
      message.textContent = "Opening Grok Bot... If nothing happens, click the button.";
      window.location.replace(target);
    })();
  </script>
</body>
</html>
